name: Create release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.2.1)'
        required: true

jobs:
  build-binaries:
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    strategy:
      matrix:
        include:
          - rid: osx-arm64
            os: macos-14
            binary: ck-osx-arm64
          - rid: osx-x64
            os: ubuntu-latest
            binary: ck-osx-x64
          - rid: linux-x64
            os: ubuntu-latest
            binary: ck-linux-x64
          - rid: linux-arm64
            os: ubuntu-latest
            binary: ck-linux-arm64
          - rid: win-x64
            os: windows-latest
            binary: ck-win-x64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag matches Program.Version
        shell: bash
        run: |
          expected="${RELEASE_TAG#v}"
          declared="$(sed -n 's/.*Version = "\([^"]*\)".*/\1/p' src/ContextKing.Cli/Program.cs | head -n 1)"
          if [ -z "$declared" ]; then
            echo "Could not extract Program.Version from src/ContextKing.Cli/Program.cs" >&2
            exit 1
          fi
          if [ "$declared" != "$expected" ]; then
            echo "Tag/version mismatch: tag=${RELEASE_TAG}, Program.Version=${declared}" >&2
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish ${{ matrix.rid }}
        shell: bash
        run: |
          dotnet publish src/ContextKing.Cli/ContextKing.Cli.csproj \
            -c Release -r ${{ matrix.rid }} -p:PublishSingleFile=true \
            -o /tmp/ck-publish -v q
          ext=""
          [[ "${{ matrix.rid }}" == win-* ]] && ext=".exe"
          cp /tmp/ck-publish/ck${ext} ${{ matrix.binary }}
          chmod +x ${{ matrix.binary }} 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.rid }}
          path: ${{ matrix.binary }}

  create-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: /tmp/binaries
          merge-multiple: true

      - name: Restore execute bits
        run: |
          chmod +x /tmp/binaries/ck-osx-arm64
          chmod +x /tmp/binaries/ck-osx-x64
          chmod +x /tmp/binaries/ck-linux-x64
          chmod +x /tmp/binaries/ck-linux-arm64

      - name: Build per-platform archives
        run: |
          VERSION="${RELEASE_TAG}"

          build_archive() {
            local platform="$1"   # osx-arm64 | osx-x64 | linux-x64
            local binary="$2"     # ck-osx-arm64 | ...
            local archive="context-king-${platform}.tar.gz"

            # Stage the files
            local stage="/tmp/stage-${platform}/context-king"
            mkdir -p "$stage/scripts"
            mkdir -p "$stage/hooks"
            mkdir -p "$stage/models/bge-small-en-v1.5/onnx"
            mkdir -p "$stage/rules"
            mkdir -p "$stage/plugins"
            mkdir -p "$stage/agents"

            cp -r skills/. "$stage/skills/"
            cp -r hooks/. "$stage/hooks/"
            cp /tmp/binaries/"$binary" "$stage/skills/ck/$binary"
            cp /tmp/binaries/"$binary" "$stage/skills/ck/ck"
            chmod +x "$stage/skills/ck/$binary" "$stage/skills/ck/ck"
            find "$stage/hooks" -type f -name '*.sh' -exec chmod +x {} \;
            cp -r models/bge-small-en-v1.5/.  "$stage/models/bge-small-en-v1.5/"
            cp rules/ck-code-search-protocol.md "$stage/rules/"
            cp plugins/ck-guards.ts            "$stage/plugins/"
            cp agents/explore.md               "$stage/agents/"
            cp THIRD_PARTY_LICENSES.md         "$stage/"
            cp scripts/install-global.sh       "$stage/scripts/"
            chmod +x "$stage/scripts/"*.sh

            tar -czf "/tmp/$archive" -C "/tmp/stage-${platform}" context-king
            echo "Built: $archive"
          }

          build_archive "osx-arm64"  "ck-osx-arm64"
          build_archive "osx-x64"    "ck-osx-x64"
          build_archive "linux-x64"  "ck-linux-x64"
          build_archive "linux-arm64" "ck-linux-arm64"

          # Windows zip
          win_stage="/tmp/stage-win/context-king"
          mkdir -p "$win_stage/scripts"
          mkdir -p "$win_stage/hooks"
          mkdir -p "$win_stage/models/bge-small-en-v1.5/onnx"
          mkdir -p "$win_stage/rules"
          mkdir -p "$win_stage/plugins"
          mkdir -p "$win_stage/agents"

          cp -r skills/. "$win_stage/skills/"
          cp -r hooks/. "$win_stage/hooks/"
          cp /tmp/binaries/ck-win-x64.exe    "$win_stage/skills/ck/"
          cp -r models/bge-small-en-v1.5/.  "$win_stage/models/bge-small-en-v1.5/"
          cp rules/ck-code-search-protocol.md "$win_stage/rules/"
          cp plugins/ck-guards.ts            "$win_stage/plugins/"
          cp agents/explore.md               "$win_stage/agents/"
          cp THIRD_PARTY_LICENSES.md         "$win_stage/"
          cp scripts/install-global.ps1      "$win_stage/scripts/"

          cd /tmp/stage-win && zip -r /tmp/context-king-windows.zip context-king
          echo "Built: context-king-windows.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Context King ${{ env.RELEASE_TAG }}"
          tag_name: ${{ env.RELEASE_TAG }}
          body: |
            ## Install

            **Step 1 — global install (once per machine):**

            **Mac / Linux:**
            ```bash
            curl -fsSL https://github.com/Fredrik-C/ContextKing/releases/latest/download/install-global.sh | bash
            ```

            **Windows (PowerShell 7+):**
            ```powershell
            irm https://github.com/Fredrik-C/ContextKing/releases/latest/download/install-global.ps1 | iex
            ```

            **Step 2 — initialize each repo (once per repo):**
            ```bash
            cd /path/to/your-repo
            ck init
            ```

            Or download the archive for your platform and run `bash scripts/install-global.sh` from within it.

            ## Platform archives
            | File | Platform |
            |------|----------|
            | `context-king-osx-arm64.tar.gz` | macOS Apple Silicon |
            | `context-king-osx-x64.tar.gz` | macOS Intel |
            | `context-king-linux-x64.tar.gz` | Linux x86-64 |
            | `context-king-linux-arm64.tar.gz` | Linux ARM64 |
            | `context-king-windows.zip` | Windows x86-64 |
          files: |
            /tmp/context-king-osx-arm64.tar.gz
            /tmp/context-king-osx-x64.tar.gz
            /tmp/context-king-linux-x64.tar.gz
            /tmp/context-king-linux-arm64.tar.gz
            /tmp/context-king-windows.zip
            /tmp/binaries/ck-osx-arm64
            /tmp/binaries/ck-osx-x64
            /tmp/binaries/ck-linux-x64
            /tmp/binaries/ck-linux-arm64
            /tmp/binaries/ck-win-x64.exe
            scripts/install-global.sh
            scripts/install-global.ps1
